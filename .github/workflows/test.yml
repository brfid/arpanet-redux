name: test

on: push

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check-source-only.py --history "$GITHUB_SHA"
      - run: python3 -m unittest discover -s tests -v
      - run: sh tests/test_runtime.sh
