name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            fetch-depth: 0
            history: true
          - os: ubuntu-latest
            python-version: "3.14"
            fetch-depth: 1
            history: false
          - os: macos-latest
            python-version: "3.14"
            fetch-depth: 1
            history: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.history
        run: python3 scripts/check-source-only.py --history "$GITHUB_SHA"
      - run: make test
